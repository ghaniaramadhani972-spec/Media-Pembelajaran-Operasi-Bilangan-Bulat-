<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garis Bilangan: Perkalian & Pembagian (Lompatan)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f8fc;--card:#fff;--tx:#1b2733;--mut:#5d6b78;--ln:#8b99a6;--a:#1f6fd1;--b:#e8780c;--r:#16a34a;--bd:#d5dee7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171f;--card:#19232d;--tx:#e8eef4;--mut:#9aa9b7;--ln:#6f7f8d;--a:#5aa2ff;--b:#ffa04d;--r:#4ade80;--bd:#2c3a47}}
:root[data-theme="dark"]{--bg:#10171f;--card:#19232d;--tx:#e8eef4;--mut:#9aa9b7;--ln:#6f7f8d;--a:#5aa2ff;--b:#ffa04d;--r:#4ade80;--bd:#2c3a47}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0 0 4px}p.sub{margin:0 0 12px;color:var(--mut);font-size:.9rem}
.tabs{display:flex;gap:6px;margin-bottom:12px}
button{font:inherit;color:var(--tx)}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--a);color:#fff;border-color:var(--a);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.scroll{overflow-x:auto}svg{display:block;min-width:680px;width:100%}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:8px}
.step{display:flex;align-items:center;gap:6px}.step b{min-width:2.2em;text-align:center;font-size:1.3rem}
.step button{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);font-size:1.2rem;cursor:pointer}
.act button{padding:8px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);cursor:pointer}
.act button.p{background:var(--r);color:#fff;border-color:var(--r);font-weight:600}
.eq{font-size:1.5rem;font-weight:700;text-align:center;margin:6px 0}.sum{text-align:center;font-size:1.1rem;word-break:break-word}
.note{color:var(--mut);text-align:center;font-size:.95rem;margin:6px 0 0}
</style></head><body><main>
<h1>Garis Bilangan</h1><p class="sub">Perkalian: Bilangan 2 dijumlahkan (dilompati) sebanyak Bilangan 1 kali. Pembagian: berapa kali lompatan sebesar Bilangan 2 sampai ke Bilangan 1.</p><div class="tabs"><button id="t1" class="on">Perkalian</button><button id="t2">Pembagian</button></div>
<div class="card scroll"><svg id="s" viewBox="0 0 840 230"></svg></div>
<div class="card" id="ctl"></div>
<script>
const X0=15,U=13.5,Y=170,W=30;const px=v=>X0+(v+W)*U;
let tab=1,a=3,b=4,j=0,timer=null;
const svg=document.getElementById('s'),ctl=document.getElementById('ctl');
const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const P=v=>v<0?`(${v})`:`${v}`;
const dirn=v=>v>=0?'kanan':'kiri';
function model(){
 if(tab===1){const n=Math.abs(a),s=a>=0?b:-b;return{n,s,res:a*b,rem:0,target:a*b}}
 const q=Math.trunc(a/b),r=a-b*q,n=Math.abs(q),s=q>=0?b:-b;return{n,s,res:q,rem:r,target:a,q}}
function base(){let s=`<line x1="${px(-W)-8}" y1="${Y}" x2="${px(W)+8}" y2="${Y}" stroke="var(--ln)" stroke-width="3"/>`;
 for(let v=-W;v<=W;v++){const m=v%5===0;s+=`<line x1="${px(v)}" y1="${Y}" x2="${px(v)}" y2="${Y+(m?13:7)}" stroke="var(--ln)" stroke-width="${v===0?3:1.5}"/>`;
 if(m)s+=`<text x="${px(v)}" y="${Y+30}" text-anchor="middle" font-size="13" fill="var(--tx)">${v}</text>`}return s}
function jump(i,s){const x1=px(i*s),x2=px((i+1)*s),h=Math.min(55,14+Math.abs(s)*U*.4),c=i%2?'b':'a',mx=(x1+x2)/2,d=s>0?1:-1;
 let o=`<path d="M${x1} ${Y-4} Q${mx} ${Y-4-2*h} ${x2} ${Y-4}" fill="none" stroke="var(--${c})" stroke-width="3"/>
 <polygon points="${x2},${Y-4} ${x2-d*10},${Y-14} ${x2-d*4},${Y-16}" fill="var(--${c})"/>`;
 if(Math.abs(s)*U>=24)o+=`<text x="${mx}" y="${Y-h-8}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--${c})">${s>0?'+':''}${s}</text>`;return o}
function draw(){const m=model();let s=base();
 if(m.s!==0)for(let i=0;i<j;i++)s+=jump(i,m.s);
 const pos=j*m.s;
 if(tab===2){s+=`<line x1="${px(m.target)}" y1="${Y-70}" x2="${px(m.target)}" y2="${Y}" stroke="var(--r)" stroke-width="2" stroke-dasharray="4 3"/><text x="${px(m.target)}" y="${Y-76}" text-anchor="middle" font-weight="700" fill="var(--r)">target ${m.target}</text>`;
  if(m.rem!==0&&j===m.n)s+=`<line x1="${px(pos)}" y1="${Y-20}" x2="${px(m.target)}" y2="${Y-20}" stroke="var(--r)" stroke-width="3" stroke-dasharray="3 3"/><text x="${(px(pos)+px(m.target))/2}" y="${Y-26}" text-anchor="middle" fill="var(--r)" font-size="13">sisa ${m.rem}</text>`}
 s+=`<circle cx="${px(0)}" cy="${Y}" r="5" fill="var(--ln)"/><circle cx="${px(pos)}" cy="${Y}" r="10" fill="var(--${j===m.n&&j>0?'r':'a'})" stroke="#fff" stroke-width="2"/>`;
 svg.innerHTML=s}
function ui(){const m=model();let h,eq,sum,note;
 const bad=tab===2&&b===0;
 if(tab===1){
  const terms=Array.from({length:m.n},()=>P(b));
  sum=m.n===0||b===0?'Tidak ada lompatan yang berpindah, hasilnya 0.':(a>0?terms.join(' + '):'−'+terms.join(' − '))+' = '+m.res;
  eq=`${P(a)} × ${P(b)} = <span style="color:var(--r)">${m.res}</span>`;
  note=a===0?'Bilangan 1 = 0, jadi Bilangan 2 dilompati 0 kali dan tetap di 0.':a>0?`Bilangan 2 (${P(b)}) dijumlahkan sebanyak Bilangan 1 (${a}) kali: ${a} lompatan ke ${dirn(b)}.`:`Bilangan 1 negatif (${a}): Bilangan 2 dijumlahkan ${Math.abs(a)} kali, tetapi arah lompatan dibalik ke ${dirn(-b)}.`;
  h=`<div class="step">Bilangan 1<button data-k="a" data-d="-1">−</button><b style="color:var(--a)">${a}</b><button data-k="a" data-d="1">+</button></div>
  <div class="step">Bilangan 2<button data-k="b" data-d="-1">−</button><b style="color:var(--b)">${b}</b><button data-k="b" data-d="1">+</button></div>`;
 }else{
  eq=`${P(a)} ÷ ${P(b)} = <span style="color:var(--r)">${m.q}</span>${m.rem?` sisa ${m.rem}`:''}`;
  sum=`${m.n} lompatan sebesar ${P(m.s)} dari 0 menuju ${a}`+(m.rem?`, sisa ${m.rem}`:`, tepat sampai (cek: ${P(b)} × ${P(m.q)} = ${a})`);
  note=a>0&&b>0?`Pengurangan berulang: ${a} dikurangi ${b} sebanyak ${m.q} kali menyisakan ${m.rem}.`:m.q<0?'Hasil negatif: lompatan berlawanan arah dengan ukuran pembagi.':'Hitung berapa kali lompatan sebesar Bilangan 2 agar mencapai Bilangan 1.';
  h=`<div class="step">Bilangan 1<button data-k="a" data-d="-1">−</button><b style="color:var(--a)">${a}</b><button data-k="a" data-d="1">+</button></div>
  <div class="step">Bilangan 2<button data-k="b" data-d="-1">−</button><b style="color:var(--b)">${b}</b><button data-k="b" data-d="1">+</button></div>`}
 ctl.innerHTML=`<div class="row">${h}</div><div class="row act"><button class="p" id="go">Lompat 1x</button><button id="pl">▶ Putar</button><button id="all">Semua</button><button id="rs">Ulang</button></div>
 <p class="note" style="margin:0">${tab===1?'Bilangan 1 × Bilangan 2':'Bilangan 1 ÷ Bilangan 2'}</p><div class="eq">${eq}</div><div class="sum">${sum}</div><p class="note">${note}</p>`;
 ctl.querySelectorAll('[data-k]').forEach(e=>e.onclick=()=>{stop();const k=e.dataset.k,d=+e.dataset.d;
  if(tab===1){if(k==='a')a=cl(a+d,-5,5);else b=cl(b+d,-5,5)}
  else{if(k==='a')a=cl(a+d,-20,20);else{b=cl(b+d,-10,10);if(b===0)b=d}}
  j=0;ui();draw()});
 document.getElementById('go').onclick=()=>{stop();if(j<model().n)j++;ui();draw()};
 document.getElementById('all').onclick=()=>{stop();j=model().n;ui();draw()};
 document.getElementById('rs').onclick=()=>{stop();j=0;ui();draw()};
 document.getElementById('pl').onclick=()=>{stop();j=0;ui();draw();timer=setInterval(()=>{if(j<model().n){j++;ui();draw()}else stop()},700)}}
function stop(){if(timer){clearInterval(timer);timer=null}}
function setTab(n){stop();tab=n;j=0;if(n===1){a=3;b=4}else{a=12;b=4}
 t1.className=n===1?'on':'';t2.className=n===2?'on':'';ui();draw()}
t1.onclick=()=>setTab(1);t2.onclick=()=>setTab(2);setTab(1);
</script></main></body></html>
